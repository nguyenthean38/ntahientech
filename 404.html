<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Không tìm thấy trang — Ntahien Tech</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;800;900&family=JetBrains+Mono:wght@700&display=swap" rel="stylesheet" />
  <style>
    :root { --bg: #f4f7f6; --ink: #0a1714; --muted: #5a6b66; --grad: linear-gradient(100deg, #16b56b, #0ea5e9); }
    @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #060c0b; --ink: #e9f2ef; --muted: #8fa29c; } }
    :root[data-theme="dark"] { --bg: #060c0b; --ink: #e9f2ef; --muted: #8fa29c; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px 16px; font-family: 'Be Vietnam Pro', system-ui, sans-serif; background: var(--bg); color: var(--ink); text-align: center; }
    .code { font-family: 'JetBrains Mono', monospace; font-weight: 700; font-size: clamp(90px, 22vw, 200px); line-height: 1; letter-spacing: -.06em; background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent; }
    h1 { font-size: clamp(24px, 4vw, 36px); font-weight: 900; margin: 14px 0 10px; letter-spacing: -.02em; }
    p { color: var(--muted); max-width: 440px; margin: 0 auto 28px; line-height: 1.7; }
    a { display: inline-flex; align-items: center; gap: 8px; height: 52px; padding: 0 26px; border-radius: 999px; background: var(--ink); color: var(--bg); font-weight: 700; text-decoration: none; }
  </style>
  <script>(function () { try { var t = localStorage.getItem('theme'); if (t) document.documentElement.setAttribute('data-theme', t); } catch (e) {} })();</script>
</head>
<body>
  <main>
    <div class="code">404</div>
    <h1>Trang này không tồn tại</h1>
    <p>Có thể đường dẫn đã thay đổi. Anh chị quay về trang chủ hoặc nhắn Zalo 0982 269 974 để được hỗ trợ nhé.</p>
    <a href="/">← Về trang chủ</a>
  </main>
</body>
</html>
